# 自动化工作日志填报系统配置

# Chrome 浏览器设置
chrome:
  executable_path: "D:\\Program Files\\RunningCheeseChrome\\App\\chrome.exe"
  remote_debugging_port: 9222

# 目标系统URL
target:
  base_url: "https://prj.chinasoftinc.com/prj/index.jsp#"

# 用户偏好
preferences:
  # 默认部门（公共工时）
  default_department: "电信与AIoT业务线"
  # 工时上限（小时）
  max_hours_per_day: 8.0
  # 日志字数上限
  max_log_length: 500
  # 节假日列表（YYYY-MM-DD），用于361评估的节假日前一天判断
  # 数据来源：2026年国务院办公厅放假安排
  holidays:
    # 元旦 01月01日-01月03日
    - "2026-01-01"
    - "2026-01-02"
    - "2026-01-03"
    # 春节 02月15日-02月23日
    - "2026-02-15"
    - "2026-02-16"
    - "2026-02-17"
    - "2026-02-18"
    - "2026-02-19"
    - "2026-02-20"
    - "2026-02-21"
    - "2026-02-22"
    - "2026-02-23"
    # 清明节 04月04日-04月06日
    - "2026-04-04"
    - "2026-04-05"
    - "2026-04-06"
    # 劳动节 05月01日-05月05日
    - "2026-05-01"
    - "2026-05-02"
    - "2026-05-03"
    - "2026-05-04"
    - "2026-05-05"
    # 端午节 06月19日-06月21日
    - "2026-06-19"
    - "2026-06-20"
    - "2026-06-21"
    # 中秋节 09月25日-09月27日
    - "2026-09-25"
    - "2026-09-26"
    - "2026-09-27"
    # 国庆节 10月01日-10月07日
    - "2026-10-01"
    - "2026-10-02"
    - "2026-10-03"
    - "2026-10-04"
    - "2026-10-05"
    - "2026-10-06"
    - "2026-10-07"

# 随机补充项过时时间语义过滤配置
# 仅影响随机补充项，不影响用户明确指定的内容
time_filter:
  # 财务/运营数据通常有滞后期，前 N 天内上月数据仍合理（如 6 月 10 日前可补充 5 月数据）
  month_lag_days: 10
  # 是否启用 LLM 语义兜底判断（需配置有效端点）
  llm_fallback: false
  # LLM 判断端点（留空则仅使用规则+启发式）
  # 请求体：{"text": "工作日志内容", "date": "2026-06-15"}
  # 期望响应：{"outdated": true} 或 {"outdated": false}
  llm_endpoint: ""
  # 可选：模型名称，会随请求体一并发送
  llm_model: ""
